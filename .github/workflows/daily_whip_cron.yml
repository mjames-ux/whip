name: Daily Parliamentary Briefing

on:
  schedule:
    # Runs at 07:00 UTC every morning
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional sitting date to backfill (YYYY-MM-DD)'
        required: false
        type: string
        default: ''

jobs:
  update-briefings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Sync active Commons roster (Sundays or manual backfill)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node sync_roster.js
          else
            echo "Skipping roster sync (runs on Sundays or manual triggers)."
          fi

      - name: Generate daily briefings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: node generate_briefings.js
