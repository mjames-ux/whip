name: Daily Whip Parliamentary Briefing

on:
  schedule:
    # Runs at 6:30 AM UTC (6:30 AM GMT / 7:30 AM BST) Tuesday–Saturday
    - cron: '30 6 * * 2-6'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional YYYY-MM-DD sitting date (leave blank for yesterday)'
        required: false
        type: string
      skip_llm:
        description: 'Skip Gemini generation completely (rebuild static pages / sync only)'
        required: false
        type: boolean
        default: false
      force_regen:
        description: 'Force regenerating existing Gemini summaries for target_date'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: whip-daily-pipeline
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Sync MP roster
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync_roster.js

      - name: Generate daily briefings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_DATE: ${{ inputs.target_date }}
          SKIP_LLM: ${{ inputs.skip_llm }}
          FORCE_REGEN: ${{ inputs.force_regen }}
        run: node generate_briefings.js

      - name: Build static MP pages & sitemap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node build_pages.js

      - name: Commit and push updated static pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mp/ sitemap.xml
          if git diff --staged --quiet; then
            echo "No static page changes to commit."
          else
            git commit -m "chore: update static MP pages & sitemap"
            git push
          fi
