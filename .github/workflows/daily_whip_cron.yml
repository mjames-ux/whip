name: Daily Whip Parliamentary Briefing

on:
  schedule:
    # Runs at 06:45 UTC (06:45 GMT / 07:45 BST) Tuesday–Saturday
    - cron: '45 6 * * 2-6'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional sitting date override (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-briefings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Sync active Commons roster
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync_roster.js

      - name: Generate daily briefings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: node generate_briefings.js

      - name: Build static MP pages & sitemap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node build_pages.js

      - name: Publish static pages to GitHub Pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mp sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update static MP pages & sitemap"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main
              if git push origin main; then
                exit 0
              fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 2
            done
            exit 1
          else
            echo "No static page changes to commit."
          fi
